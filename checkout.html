<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — VIKALPAYATI by Vishakha</title>
<link rel="stylesheet" href="css/styles.css?v=2"></head><body>
<div class="banner">✨ Free shipping on orders above ₹2999 · <a href="https://wa.me/919755816439" target="_blank">Order on WhatsApp 9755816439</a></div>
<header data-navbar></header>

<main class="container section" id="checkout-root"></main>

<!-- MOCK PAYMENT MODAL (hidden by default) -->
<div class="modal-backdrop" id="pay-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Secure Payment</h3>
      <button class="x-close" type="button" id="pay-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <p class="muted" style="margin-top:0">Amount payable</p>
      <div class="price" style="font-size:2rem" id="pay-amount">₹0</div>

      <div style="display:flex;gap:10px;margin:18px 0 6px">
        <button class="chip active" type="button" id="tab-upi">UPI</button>
        <button class="chip" type="button" id="tab-card">Card</button>
      </div>

      <div id="upi-fields">
        <div class="field">
          <label for="upi-id">UPI ID</label>
          <input type="text" id="upi-id" placeholder="yourname@upi">
        </div>
      </div>

      <div id="card-fields" style="display:none">
        <div class="field">
          <label for="card-num">Card Number</label>
          <input type="text" id="card-num" placeholder="1234 5678 9012 3456" maxlength="19">
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="card-exp">Expiry</label>
            <input type="text" id="card-exp" placeholder="MM/YY" maxlength="5">
          </div>
          <div class="field">
            <label for="card-cvv">CVV</label>
            <input type="text" id="card-cvv" placeholder="123" maxlength="4">
          </div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" type="button" id="pay-cancel">Cancel</button>
      <button class="btn btn-primary" type="button" id="pay-now">Pay ₹0</button>
    </div>
  </div>
</div>

<footer class="footer" data-footer></footer>
<a class="fab-wa" href="https://wa.me/919755816439" target="_blank" aria-label="WhatsApp"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1012 2z"/></svg></a>

<script src="js/chat.js?v=2"></script>
</body></html>
